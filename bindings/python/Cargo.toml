[package]
name = "sqzdb-python"
version = "0.13.1"
edition = "2024"
license = "MIT"

[lib]
name = "sqzdb_py"
crate-type = ["cdylib"]

[dependencies]
sqzdb = { path = "../.." }   # includes the web console (off until listen.http is set)
pyo3 = { version = "0.28", features = ["extension-module"] }
serde_json = "1"

[profile.release]
strip = true
