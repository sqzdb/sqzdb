[package]
name = "sqzdb_node"
version = "0.13.1"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
sqzdb = { path = "../.." }   # includes the web console (off until listen.http is set)
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
strip = true
