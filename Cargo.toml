[package]
name = "sqzdb"
version = "0.15.0"
homepage = "https://sqzdb.dev"
repository = "https://github.com/sqzdb/sqzdb"
edition = "2024"
license = "MIT"

[lib]
name = "sqzdb"
crate-type = ["rlib", "cdylib"]

[dependencies]
memmap2 = "0.9.11"
rusqlite = { version = "0.40.2", features = ["backup", "hooks"], optional = true }   # reference engine for the experiments (feature "lab")
sqlparser = "0.63.0"
turso = { version = "0.8.3", optional = true }   # reference engine for the experiments (feature "lab")
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }   # the app API runs its connections as tasks (app.rs)
# TLS for the app API (tls.rs): the server side of rustls, and certificates from an ACME CA such as Let's Encrypt
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
object_store = { version = "0.13", features = ["aws"] }
futures-util = "0.3"
# the app API's HTTP/1.1 and HTTP/2 (app.rs), and its client to an upstream it proxies to (proxy.rs)
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "client-legacy", "tokio", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
zstd = "0.13"
aes-gcm = "0.10"
sha2 = "0.10"
libc = "0.2"
getrandom = "0.3"   # UUIDs: the operating system's secure random source
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }   # a function's result keeps its keys in order
toml = "0.8"
toml_edit = "0.22"
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
ring = "0.17"
base64 = "0.22"
# functions (functions.rs): an app's own TypeScript or JavaScript, run in QuickJS inside the database; oxc strips the
# types (with a source map, so errors point at the TypeScript)
rquickjs = { version = "0.14", features = ["std", "loader", "parallel"] }
oxc_allocator = "0.154"
oxc_parser = "0.154"
oxc_span = "0.154"
oxc_semantic = "0.154"
oxc_transformer = "0.154"
oxc_codegen = "0.154"
oxc_sourcemap = "9"
oxc_diagnostics = "0.154"

# The static Linux builds use musl, whose allocator made the engine 2x slower (measured in E45); the command uses
# mimalloc there. Library builds keep the host allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[features]
default = ["ui"]
# the experiments in src/bin that race SQLite and Turso: `cargo lab e40_tcp` (alias in .cargo/config.toml)
lab = ["dep:rusqlite", "dep:turso"]
# the web console (listen.http): off at runtime until configured; build without it for the smallest library
ui = []
bundled = ["lab", "rusqlite/bundled"]

# Release artifacts: `cargo build --profile dist` (what `make install` and the release workflow build)
# The Node addon (bindings/node) is a member so it shares this lockfile and these profiles, and a release builds
# the crate once for the command and the addon (make build WITH_NODE=1). A plain `cargo build` builds sqzdb alone;
# the addon is `-p sqzdb_node` (make node, make node-dist).
[workspace]
members = ["bindings/node"]
default-members = ["."]

[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "thin"
codegen-units = 1

# Experiments that compare against SQLite or Turso need the "lab" feature.
[[bin]]
name = "e50_durable_writers"
path = "src/bin/e50_durable_writers.rs"
required-features = ["lab"]

